<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - Planet Books</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Catalog.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>

<body data-user="${session.user != null}">
<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!--Intro-->
<section class="container text-center mt-5 pt-5">
    <h2 class="display-4 fw-bold mb-4 text-balance">
        English
        <span class="d-block text-muted">Exam Preparation</span>
    </h2>
    <p class="lead text-muted mb-0 mx-auto text-pretty" style="max-width: 600px">Explore our selection of Cambridge &
        international exam books to prepare effectively s.</p>
</section>

<!--Filters-->
<section class="search-section mt-5">
    <div class="container">
        <div class="row g-3 align-items-center">
            <div class="col-md-6">
                <div class="row g-3">
                    <div class="col-sm-8">
                        <div class="input-group">
                                    <span class="input-group-text">
                                        <i data-lucide="search" class="me-1"></i>
                                    </span>
                            <input id="search-input" type="text" class="form-control"
                                   placeholder="Search for books or publishers...">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="row justify-content-md-end">
                    <div class="col-md-6">
                        <select class="form-select">
                            <option value="featured">Featured</option>
                            <option value="lower-price">Price: lowest to highest</option>
                            <option value="highest-price">Price: highest to lowest</option>
                            <option value="best-rated">Best rated</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!--Sidebar + catalog-->
<main class="mt-4 pt-1">
    <div class="container-fluid">
        <div class="row">
            <div th:replace="fragments/sidebar-catalog :: sidebar-catalog"></div>

            <section class="col-md-9 col-lg-10">
                <div class="row g-4" id="book-list">

                    <div th:replace="fragments/catalog_book-card ::
                book-card(${starters}, 'starters')"></div>

                    <div th:replace="fragments/catalog_book-card ::
                book-card(${movers}, 'movers')"></div>

                    <div th:replace="fragments/catalog_book-card ::
                book-card(${flyers}, 'flyers')"></div>

                    <div th:replace="fragments/catalog_book-card ::
                book-card(${ket}, 'ket')"></div>

                </div>
            </section>

        </div>
    </div>
</main>
    <!-- Action Buttons under catalog -->
    <div class="catalog-actions text-center">
        <button class="btn btn-success checkout-btn" type="button" id="checkoutBtn">
            Checkout
            <i data-lucide="arrow-right" class="ms-2"></i>
        </button>
    </div>

</div>
    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
<script>lucide.createIcons()</script>
<script th:src="@{/js/cart.js}"></script>
<script th:src="@{/js/Catalog.js}"></script>
</body>
</html>
