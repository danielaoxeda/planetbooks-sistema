<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Planet Books</title>
      <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
      <link rel="manifest" href="/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link rel="stylesheet" th:href="@{/css/Catalog.css}">
  </head>
  <body>
  <main class="container-fluid p-0">

          <div class="col-auto p-0" th:insert="fragments/Sidebar :: Sidebar"></div>

          <div class="main-content">
              <div class="container mt-4">

              <section class="text-start">
                    <div class="d-flex justify-content-between align-items-center gap-2">
                        <h2 class="display-4 fw-bold mb-4 text-balance">
                            <svg class="bi me-1" width="50" height="50" fill="currentColor">
                                <use xlink:href="#book"/>
                            </svg>
                                Product Catalog
                        </h2>

                        <form class="d-flex flex-grow-1 ms-5" role="search">
                            <input class="form-control" type="search" placeholder="Search..." aria-label="Search">
                        </form>

                        <button class="btn btn-success"
                                data-bs-toggle="modal"
                                data-bs-target="#addProductModal">
                            + Add Book
                        </button>
                        <!-- ============================= -->
                        <!--    MODAL: ADD PRODUCT         -->
                        <!-- ============================= -->
                        <div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog modal-lg">
                                <div class="modal-content">

                                    <form th:action="@{/dash-products/add}" method="post" enctype="multipart/form-data">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Add New Book</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>

                                    <div class="modal-body">

                                        <div class="row g-3">

                                            <div class="col-md-6">
                                                <label class="form-label">Title</label>
                                                <input type="text" name="title" class="form-control" required>
                                            </div>

                                            <div class="col-md-6">
                                                <label class="form-label">Publisher</label>
                                                <input type="text" name="publisher" class="form-control" required>
                                            </div>

                                            <div class="col-12">
                                                <label class="form-label">Description</label>
                                                <textarea name="description" class="form-control" rows="3"></textarea>
                                            </div>

                                            <div class="col-md-4">
                                                <label class="form-label">Material Type</label>
                                                <input name="material_type" class="form-control">
                                            </div>

                                            <div class="col-md-4">
                                                <label class="form-label">Year</label>
                                                <input name="year" type="number" class="form-control">
                                            </div>

                                            <div class="col-md-4">
                                                <label class="form-label">Format</label>
                                                <select name="format" class="form-select">
                                                    <option>PDF</option>
                                                    <option>PDF + MP3</option>
                                                    <option>PDF + MP3 + Keys</option>
                                                    <option>Book + Audio</option>
                                                </select>
                                            </div>

                                            <div class="col-md-4">
                                                <label class="form-label">Exam</label>
                                                <select name="exam" class="form-select">
                                                    <option>STARTERS</option>
                                                    <option>MOVERS</option>
                                                    <option>FLYERS</option>
                                                    <option>KET</option>
                                                    <option>PET</option>
                                                    <option>FCE</option>
                                                    <option>CAE</option>
                                                    <option>CPE</option>
                                                    <option>IELTS</option>
                                                    <option>TOEFL</option>
                                                    <option>SAT</option>
                                                </select>

                                            </div>

                                            <div class="col-md-4">
                                                <label class="form-label">Level</label>
                                                <input name="level" class="form-control" required>
                                            </div>

                                            <div class="col-md-4">
                                                <label class="form-label">Price</label>
                                                <input name="price" type="number" step="0.01" class="form-control" required>
                                            </div>

                                            <div class="col-12">
                                                <label class="form-label">Book Cover</label>
                                                <input type="file" name="imageFile" class="form-control" accept="image/*">
                                            </div>

                                        </div>

                                    </div>

                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-success">Save Product</button>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>

                </div>
            </section>

             <section>
                 <div class="row g-4" id="book-list">
                     <th:block th:replace="fragments/admin_book-card ::
                            book-card(${starters}, 'starters')"></th:block>

                     <th:block th:replace="fragments/admin_book-card ::
                            book-card(${movers}, 'movers')"></th:block>

                     <th:block th:replace="fragments/admin_book-card ::
                            book-card(${flyers}, 'flyers')"></th:block>

                     <th:block th:replace="fragments/admin_book-card ::
                            book-card(${ket}, 'ket')"></th:block>
                 </div>
             </section>


            <!-- ============================= -->
            <!--        MODAL: EDIT PRODUCT    -->
            <!-- ============================= -->
                  <div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
                      <div class="modal-dialog modal-lg">
                          <div class="modal-content">

                              <form id="editProductForm" method="post" enctype="multipart/form-data">

                                  <div class="modal-header">
                                      <h5 class="modal-title">Edit Product</h5>
                                      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                  </div>

                                  <div class="modal-body">

                                      <input type="hidden" name="id" id="edit-id">

                                      <div class="row g-3">

                                          <div class="col-md-6">
                                              <label class="form-label">Title</label>
                                              <input type="text" name="title" id="edit-title" class="form-control">
                                          </div>

                                          <div class="col-md-6">
                                              <label class="form-label">Publisher</label>
                                              <input type="text" name="publisher" id="edit-publisher" class="form-control">
                                          </div>

                                          <div class="col-12">
                                              <label class="form-label">Description</label>
                                              <textarea name="description" id="edit-description" class="form-control"></textarea>
                                          </div>

                                          <div class="col-md-4">
                                              <label class="form-label">Material Type</label>
                                              <input name="material_type" id="edit-material_type" class="form-control">
                                          </div>

                                          <div class="col-md-4">
                                              <label class="form-label">Year</label>
                                              <input name="year" id="edit-year" type="number" class="form-control">
                                          </div>

                                          <div class="col-md-4">
                                              <label class="form-label">Format</label>
                                              <select name="format" id="edit-format" class="form-select">
                                                  <option>PDF</option>
                                                  <option>PDF + MP3</option>
                                                  <option>PDF + MP3 + Keys</option>
                                                  <option>Book + Audio</option>
                                              </select>
                                          </div>

                                          <div class="col-md-4">
                                              <label class="form-label">Exam</label>
                                              <select name="exam" id="edit-exam" class="form-select">
                                                  <option>STARTERS</option>
                                                  <option>MOVERS</option>
                                                  <option>FLYERS</option>
                                                  <option>KET</option>
                                                  <option>PET</option>
                                                  <option>FCE</option>
                                                  <option>CAE</option>
                                                  <option>CPE</option>
                                                  <option>IELTS</option>
                                                  <option>TOEFL</option>
                                              </select>
                                          </div>

                                          <div class="col-md-4">
                                              <label class="form-label">Level</label>
                                              <input name="level" id="edit-level" class="form-control">
                                          </div>

                                          <div class="col-md-4">
                                              <label class="form-label">Price</label>
                                              <input name="price" id="edit-price" type="number" step="0.01" class="form-control">
                                          </div>

                                          <div class="col-12">
                                              <label class="form-label">Replace Image</label>
                                              <input type="file" name="imageFile" class="form-control" accept="image/*">
                                              <small class="text-muted">If you don't upload a new image, it keeps the old one</small>
                                          </div>

                                      </div>

                                  </div>

                                  <div class="modal-footer">
                                      <button type="submit" class="btn btn-primary">Save Changes</button>
                                  </div>

                              </form>

                          </div>
                      </div>
                  </div>

              </div>
            </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/producto.js"></script>
    <script src="js/dash-products.js"></script>
</body>
</html>
