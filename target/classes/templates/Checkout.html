<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Planet Books</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/sonner/dist/index.css"> <link rel="stylesheet" th:href="@{/css/Login.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<script src="https://www.paypal.com/sdk/js?client-id=AUAQLoyeT0ZMqOCVye8ioYOEJ_oxYunFuEiAT3rTOHVnKeiSXH56YzXRyLUIxJPHmMZoih4KWz9UgUzb&currency=USD"></script>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 mt-5 flex-grow-1">

    <div class="row g-5">
        <div class="col-lg-8">
            <h4 class="fw-bold mb-4 text-secondary">
                <i data-lucide="shopping-bag" class="me-2"></i>Your Cart
            </h4>

            <div class="card border-0 shadow-sm p-3">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th scope="col" width="40%">Product</th>
                            <th scope="col">Price</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Total</th>
                            <th scope="col"></th>
                        </tr>
                        </thead>
                        <tbody id="cartPageItems">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 sticky-top" style="top: 100px;">
                <h5 class="fw-bold mb-3">Order Summary</h5>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Subtotal</span>
                    <span class="fw-semibold text-dark">$ <span id="cartPageTotal">0.00</span></span>
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <span class="text-muted">Shipping (Email)</span>
                    <span class="text-success fw-bold">Free</span>
                </div>

                <hr>

                <div id="paypal-button-container" class="mt-4"></div>

                <div class="mt-3 text-center">
                    <small class="text-muted">
                        <i data-lucide="lock" size="14"></i> Secure Checkout
                    </small>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://unpkg.com/sonner/dist/sonner.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/checkout.js}"></script>
<script>lucide.createIcons();</script>
document.getElementById("checkoutBtn")

</body>
</html>
