<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Successful | Planet Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 mt-5 text-center">

    <img src="https://cdn-icons-png.flaticon.com/512/845/845646.png"
         width="120" class="mb-4" alt="Success">

    <h2 class="fw-bold text-success">Your books are on the way! 📚✨</h2>

    <p class="lead text-muted mt-3">
        The payment was completed successfully.<br>
        We’ve sent your books to your email:
        <span class="fw-bold text-dark" th:text="${email}"></span>
    </p>

    <a th:href="@{/catalog}" class="btn btn-success mt-4 px-4 py-2">
        Continue Shopping
    </a>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
