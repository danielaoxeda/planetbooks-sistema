<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - PlanetBooks</title>
      <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
      <link rel="manifest" href="/site.webmanifest">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    /* Desktop: margen para sidebar */
    @media (min-width: 992px) {
        .main-content {
            margin-left: 280px; /* coincide con el ancho de sidebar */
        }
    }
    /* Móvil: ocupa todo el ancho */
    @media (max-width: 991.98px) {
        .main-content {
            margin-left: 0 !important;
            width: 100% !important;
        }

        .offcanvas {
    background-color: #212529 !important; /* coincide con tu sidebar oscuro */
}
    }
</style>
  </head>
  <body>
    <main class="d-flex flex-nowrap">

        <!-- Sidebar desktop (visible solo lg+) -->
        <div class="d-none d-lg-block sidebar-desktop" th:insert="fragments/Sidebar :: Sidebar"></div>

        <div class="flex-grow-1 main-content">

            <!-- Botón hamburguesa móvil (d-lg-none) -->
            <button class="btn btn-outline-dark d-lg-none m-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar" aria-controls="offcanvasSidebar">
               MENU <i class="bi bi-list fs-3"></i>
            </button>

           
            <!-- Offcanvas para móviles -->
            <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title">Menu</h5>
                    <!-- Aquí cambia -->
                    <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body p-0">
                    <div th:insert="fragments/Sidebar :: Sidebar"></div>
                </div>
            </div>


            <!-- Contenido principal -->
            <div class="container mt-4">
                <section class="text-start">
                    <h2 class="display-4 fw-bold mb-4 text-balance"> 
                        <svg class="bi me-1" width="60" height="60" fill="currentColor">
                            <use xlink:href="#people-circle"/>
                        </svg>
                        Clients
                    </h2>
                    <div class="d-flex align-items-center justify-content-between flex-wrap mb-4">
                        <div>
                            <span class="fw-bold fs-5 d-block mb-1">Clients List</span>
                            <small class="text-muted">
                                <span>Total Registered Clients: <strong th:text="${totalActive}"></strong></span>
                                <span class="ms-3">Total Deleted Clients: <strong th:text="${totalDeleted}"></strong></span>
                            </small>
                        </div>
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                            <form class="d-flex align-items-center gap-2 flex-wrap" method="get" th:action="@{/clients}">
                                <input type="text" name="search" class="form-control w-auto" placeholder="Search customers..." th:value="${search}">
                                <button class="btn btn-success w-auto" type="submit">Search</button>
                            </form>
                            <button class="btn btn-secondary w-auto" onclick="window.location.href='/clients/deleted'"> View Deleted </button>
                        </div>
                    </div>
                </section>

                <!-- Clients table -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Father's Last Name</th>
                                <th>Mother's Last Name</th>
                                <th>Age</th>
                                <th>User</th>
                                <th>Email</th>
                                <th>Country</th>
                                <th>Registration Date</th>
                                <th>Purchases</th>
                                <th>Sessions</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                        <tr th:each="client : ${clients}">
                            <td th:text="${client.id}"></td>
                            <td th:text="${client.name}"></td>
                            <td th:text="${client.last_name_father}"></td>
                            <td th:text="${client.last_name_mother}"></td>
                            <td th:text="${client.age}"></td>
                            <td th:text="${client.user}"></td>
                            <td th:text="${client.email}"></td>
                            <td th:text="${client.country}"></td>
                            <td th:text="${client.registration_date}"></td>
                            <td th:text="${client.purchases}"></td>
                            <td th:text="${client.sessions}"></td>
                            <td>
                                <a th:href="@{/clients/edit/{id}(id=${client.id})}" class="btn btn-primary btn-sm">Edit</a>
                                <a th:href="@{/clients/delete/{id}(id=${client.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this client?');">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Cerrar offcanvas al hacer click en un link
        document.querySelectorAll('#offcanvasSidebar a.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasSidebar'));
                if (offcanvas) offcanvas.hide();
            });
        });
    </script>
  </body>
</html>
