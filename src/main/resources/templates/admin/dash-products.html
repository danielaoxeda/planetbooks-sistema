<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - PlanetBooks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <main class="d-flex flex-nowrap">
        <div th:insert="fragments/Sidebar :: Sidebar"></div>

          <div class="main-content">
        <div class="container mt-4">
            <section class="text-start">
                <div class="d-flex justify-content-between align-items-center gap-2">
                    <h2 class="display-4 fw-bold mb-4 text-balance"> 
                        <svg class="bi me-1" width="50" height="50" fill="currentColor">
                            <use xlink:href="#book"/>
                        </svg>
                            Product Catalog 
                    </h2>

                    <form class="d-flex flex-grow-1 ms-5" role="search">
                        <input class="form-control" type="search" placeholder="Search..." aria-label="Search">
                    </form>

                    <button class="btn btn-success" type="submit">+ Add Book</button>

                </div>
            </section>


            <div class="row row-cols-1 row-cols-md-3 g-4 mt-4">

                <!-- =========================================== -->
                <!--                STARTERS                     -->
                <!-- =========================================== -->
                <div th:each="book : ${starters}" class="col-sm-6 col-lg-4 col-xl-3">
                    <div class="card book-card h-100">
                        <div class="position-relative overflow-hidden">

                            <img th:src="@{'/uploads/books' + ${book.image}}"
                                 th:alt="${book.title}"
                                 class="card-img-top book-image">

                            <span th:if="${book.featured}"
                                  class="badge rounded-pill text-bg-success position-absolute top-0 start-0 m-2">
                    Featured
                </span>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <div class="mb-2">
                                <span class="badge text-bg-secondary">Starters</span>
                            </div>

                            <h5 class="card-title fw-semibold text-balance"
                                th:text="${book.title}"></h5>

                            <p class="text-muted small mb-2"
                               th:text="${book.publisher}"></p>

                            <p class="card-text small text-pretty mb-3"
                               th:text="${book.description}"></p>

                            <div class="mt-auto">
                    <span class="price-current"
                          th:text="'S/ ' + ${book.price}"></span>
                            </div>

                            <div class="mt-auto">
                                <div class="d-flex justify-content-between gap-2">
                                    <button class="btn btn-warning flex-fill">
                                        <i data-lucide="edit-2" class="me-1"></i> Edit
                                    </button>

                                    <button class="btn btn-danger flex-fill">
                                        <i data-lucide="trash-2" class="me-1"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- =========================================== -->
                <!--                MOVERS                       -->
                <!-- =========================================== -->
                <div th:each="book : ${movers}" class="col-sm-6 col-lg-4 col-xl-3">>
                    <div class="card book-card h-100">
                        <div class="position-relative overflow-hidden">
                            <img th:src="@{'/uploads/books' + ${book.image}}" class="card-img-top book-image">
                            <span th:if="${book.featured}" class="badge rounded-pill text-bg-success position-absolute top-0 start-0 m-2">Featured</span>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <span class="badge text-bg-secondary">Movers</span>

                            <h5 class="card-title fw-semibold" th:text="${book.title}"></h5>
                            <p class="text-muted small mb-2" th:text="${book.publisher}"></p>
                            <p class="card-text small mb-3" th:text="${book.description}"></p>

                            <span class="price-current" th:text="'S/ ' + ${book.price}"></span>

                            <div class="mt-auto d-flex gap-2">
                                <button class="btn btn-warning flex-fill"><i data-lucide="edit-2"></i> Edit</button>
                                <button class="btn btn-danger flex-fill"><i data-lucide="trash-2"></i> Delete</button>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- =========================================== -->
                <!--                FLYERS                       -->
                <!-- =========================================== -->
                <div th:each="book : ${flyers}" class="col-sm-6 col-lg-4 col-xl-3">
                    <div class="card book-card h-100">
                        <div class="position-relative overflow-hidden">
                            <img th:src="@{'/uploads/books' + ${book.image}}" class="card-img-top book-image">
                            <span th:if="${book.featured}" class="badge rounded-pill text-bg-success position-absolute top-0 start-0 m-2">Featured</span>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <span class="badge text-bg-secondary">Flyers</span>

                            <h5 class="card-title fw-semibold" th:text="${book.title}"></h5>
                            <p class="text-muted small" th:text="${book.publisher}"></p>
                            <p class="card-text small mb-3" th:text="${book.description}"></p>

                            <span class="price-current" th:text="'S/ ' + ${book.price}"></span>

                            <div class="mt-auto d-flex gap-2">
                                <button class="btn btn-warning flex-fill">Edit</button>
                                <button class="btn btn-danger flex-fill">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- =========================================== -->
                <!--                KET                          -->
                <!-- =========================================== -->
                <div th:each="book : ${ket}" class="col-sm-6 col-lg-4 col-xl-3">
                    <div class="card book-card h-100">
                        <div class="position-relative overflow-hidden">
                            <img th:src="@{'/uploads/books' + ${book.image}}" class="card-img-top book-image">
                            <span th:if="${book.featured}" class="badge rounded-pill text-bg-success position-absolute top-0 start-0 m-2">Featured</span>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <span class="badge text-bg-secondary">KET</span>

                            <h5 class="card-title fw-semibold" th:text="${book.title}"></h5>
                            <p class="text-muted small" th:text="${book.publisher}"></p>
                            <p class="card-text small mb-3" th:text="${book.description}"></p>

                            <span class="price-current" th:text="'S/ ' + ${book.price}"></span>

                            <div class="mt-auto d-flex gap-2">
                                <button class="btn btn-warning flex-fill">Edit</button>
                                <button class="btn btn-danger flex-fill">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>


        </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/producto.js"></script>
</body>
</html>
