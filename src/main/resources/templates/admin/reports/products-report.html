<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Report | Planet Books Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:insert="fragments/sidebar :: Sidebar"></div>
        <main class="px-md-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2 text-gray-800">Book Performance Report (Products)</h1>
            </div>
            <div th:replace="fragments/reports-tabs :: tabs('books')"></div>

            <div class="tab-pane-content" id="books-content">
                <!-- FILTROS -->
                <div class="card shadow-lg mb-5 rounded-3 border-0">
                    <div class="card-header bg-white fw-bold border-bottom-0 d-flex align-items-center p-4">
                        <i class="bi bi-funnel-fill me-2 text-primary fs-5"></i> Filter Options
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4 col-lg-3">
                                <label for="filtroPublisher" class="form-label text-muted small mb-1">Publisher</label>
                                <select class="form-select rounded-pill" id="filtroPublisher">
                                    <option selected>All Publishers</option>
                                    <option>Cambridge</option>
                                    <option>Oxford</option>
                                </select>
                            </div>
                            <div class="col-md-4 col-lg-3">
                                <label for="filtroPrecio" class="form-label text-muted small mb-1">Price Range</label>
                                <select class="form-select rounded-pill" id="filtroPrecio">
                                    <option selected>All Prices</option>
                                    <option>$1 - $2</option>
                                    <option>$3 - $4</option>
                                    <option>$5 and up</option>
                                </select>
                            </div>
                            <div class="col-12 col-lg-3 d-flex justify-content-end justify-content-lg-start">
                                <button id="btnApplyFilters" type="button" class="btn btn-primary rounded-pill shadow-sm me-2">
                                    <i class="bi bi-search me-1"></i> Apply Filters
                                </button>
                                <button id="btnExportTopBooks" type="button" class="btn btn-success rounded-pill shadow-sm">
                                    <i class="bi bi-file-earmark-excel me-1"></i> Export to Excel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TABLA -->
                <h2 class="h4 mt-3 mb-3 text-gray-700">Books by Publisher & Price Range</h2>
                <div class="card shadow-lg mb-4 rounded-3 border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped table-hover table-sm align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th class="text-center">#</th>
                                    <th>Book Title</th>
                                    <th>Exam</th>
                                    <th class="text-center">Price</th>
                                    <th>Publisher</th>
                                </tr>
                                </thead>
                                <tbody id="topBooksBody">
                                    <!-- JS llenará aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>  <!-- CIERRA tab-pane-content -->
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/products_report.js}"></script>
</body>
</html>
