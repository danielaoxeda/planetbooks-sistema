<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Report - PlanetBooks Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div th:insert="fragments/sidebar :: Sidebar"></div>
            <main class="px-md-4 main-content">

                <!-- HEADER -->
                <section class="text-start">
                    <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-4 border-bottom">
                        <h1 class="h2 text-gray-800">
                            <i class="bi bi-bar-chart-line me-2"></i>
                            Detailed Sales Report
                        </h1>
                    </div>
                </section>

                <div th:replace="fragments/reports-tabs :: tabs(${activeTab})"></div>

                <!-- FILTERS -->
                <div class="card shadow-lg mb-5 rounded-3 border-0">
                    <div class="card-header bg-white fw-bold border-bottom-0 d-flex align-items-center p-4">
                        <i class="bi bi-funnel-fill me-2 text-primary fs-5"></i>
                        Sales Report Filters
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-3 align-items-stretch">

                            <!-- Start Date -->
                            <div class="col-md-4 col-lg-3 d-flex flex-column">
                                <label for="startDate" class="form-label text-muted small mb-1">Start Date</label>
                                <input type="date" class="form-control rounded-pill" id="startDate">
                            </div>

                            <!-- End Date -->
                            <div class="col-md-4 col-lg-3 d-flex flex-column">
                                <label for="endDate" class="form-label text-muted small mb-1">End Date</label>
                                <input type="date" class="form-control rounded-pill" id="endDate">
                            </div>

                            <!-- Category -->
                            <div class="col-md-4 col-lg-3 d-flex flex-column">
                                <label for="category" class="form-label text-muted small mb-1">Publisher</label>
                                <select class="form-select rounded-pill flex-grow-1" id="category">
                                    <option selected>All...</option>
                                    <option>Cambridge</option>
                                    <option>Oxford</option>
                                </select>
                            </div>

                            <!-- Generate report -->
                            <div class="col-12 col-lg-3 d-flex justify-content-end justify-content-lg-start">
                                <button type="button" class="btn btn-primary rounded-pill shadow-sm h-100">
                                    <i class="bi bi-bar-chart-fill me-1"></i> Generate Report
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="px-md-4"></div>
                <h2 class="h4 mt-3 mb-3 text-gray-700">Recent Purchases (Last 30 Days)</h2>
                <div class="card shadow-lg mb-4 rounded-3 border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-sm align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Transaction ID</th>
                                        <th>Customer Name</th>
                                        <th>Book Purchased</th>
                                        <th>Amount</th>
                                        <th>Sale Date</th>
                                        <th>Payment method</th>
                                    </tr>
                                </thead>
                                <tbody id="recentSalesTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <script th:src="@{/js/sales_report.js}"></script>

</body>

</html>
