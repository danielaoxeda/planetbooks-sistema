<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deleted Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Deleted Clients</h2>
        <a th:href="@{/clients}" class="btn btn-secondary">← Back to Clients</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Father's Last Name</th>
                <th>Mother's Last Name</th>
                <th>Email</th>
                <th>Country</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${clients}">
                <td th:text="${client.id}"></td>
                <td th:text="${client.name}"></td>
                <td th:text="${client.last_name_father}"></td>
                <td th:text="${client.last_name_mother}"></td>
                <td th:text="${client.email}"></td>
                <td th:text="${client.country}"></td>
                <td>
                    <a th:href="@{/clients/restore/{id}(id=${client.id})}"
                       class="btn btn-success btn-sm">
                        Restore
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(clients)}">
                <td colspan="7" class="text-muted">There are no deleted clients.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
