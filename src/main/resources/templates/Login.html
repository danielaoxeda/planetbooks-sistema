<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/Login.css}">
  <link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>

<body>
  <!-- Navbar -->
  <div th:replace="fragments/navbar :: navbar"></div>

  <!-- Main -->
  <main class="d-flex justify-content-center align-items-center vh-100">
    <div class="card login-card p-5">
      <div class="login-header text-center">
        <img th:src="@{/img/logo-planetbooks.png}" alt="Logo" style="width: 80px; height: auto;">
        <h4 class="fw-bold">Login</h4>
        <p class="text-muted">Access your account</p>
      </div>
        <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" name="email" id="floatingInput" required>
                <label for="floatingInput">Email address</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" name="password" id="floatingPassword" required>
                <label for="floatingPassword">Password</label>
            </div>

            <button type="submit" class="btn btn-success w-100">Sign in</button>
        </form>

        <div class="text-center mt-3">
        <a href="#" class="text-decoration-none">Forgot your password?</a>
        <p class="mt-2 mb-0">Don’t have an account?
          <a th:href="@{/register}" class="fw-bold text-success text-decoration-none">Create one</a>

        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div th:replace="fragments/footer :: footer"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    lucide.createIcons();
  </script>
  <script th:src="@{/js/cart.js}"></script>
</body>

</html>
